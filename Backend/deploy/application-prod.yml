# ============================================
# 生产环境配置
# 使用方式: java -jar app.jar --spring.profiles.active=prod
# 敏感信息通过环境变量注入，不在文件中硬编码
# ============================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sale_manager}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:salemanager}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:salemanager}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/sale_manager_i18n?authSource=admin
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

i18n:
  default-locale: zh-CN
  supported-locales:
    - zh-CN
    - en-US
    - ja-JP
  fallback-chain:
    zh-TW:
      - zh-CN
      - en-US
    ja-JP:
      - en-US
      - zh-CN
    en-US:
      - zh-CN
  cache:
    unit-ttl: 3600
    entity-ttl: 3600
    status-ttl: 1800

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: ${SERVER_PORT:8080}
