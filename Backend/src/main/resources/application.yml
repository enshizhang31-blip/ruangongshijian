# i18n
i18n:
  default-locale: zh-CN
  supported-locales:
    - zh-CN
    - en-US
    - ja-JP
  fallback-chain:
    zh-TW:
      - zh-CN
      - en-US
    ja-JP:
      - en-US
      - zh-CN
      - zh-CN
  cache:
    unit-ttl: 3600
    entity-ttl: 3600
    status-ttl: 1800