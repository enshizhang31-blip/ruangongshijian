spring:
  application:
    name: Backend
  datasource:
    url: jdbc:mysql://localhost:3306/sale_manager?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

server:
  port: 8080

jwt:
  secret: sale-manager-jwt-secret-key-2026
  expiration: 86400000

# MongoDB
spring:
  data:
    mongodb:
      uri: mongodb://salemanager:salemanager123@localhost:27017/sale_manager_i18n?authSource=admin
    redis:
      host: localhost
      port: 6379

# i18n
i18n:
  default-locale: zh-CN
  supported-locales:
    - zh-CN
    - en-US
    - ja-JP
  fallback-chain:
    zh-TW:
      - zh-CN
      - en-US
    ja-JP:
      - en-US
      - zh-CN
    en-US:
      - zh-CN
  cache:
    unit-ttl: 3600
    entity-ttl: 3600
    status-ttl: 1800