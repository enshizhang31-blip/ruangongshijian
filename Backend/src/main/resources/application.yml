# 公共配置（不要在此处放置环境敏感信息）
# 环境相关的数据库/Redis/Mongo 配置请放到 application-local.yml 或 application-cloud.yml

spring:
  application:
    name: Backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

server:
  port: 8080

# 公共 JWT（可由具体 profile 覆盖）
jwt:
  secret: sale-manager-jwt-secret-key-2026
  expiration: 86400000

# 全局分页限制
sale-manager:
  pagination:
    max-page-size: 100

# i18n 公共配置
i18n:
  default-locale: zh-CN
  supported-locales:
    - zh-CN
    - en-US
    - ja-JP
  fallback-chain:
    zh-TW:
      - zh-CN
      - en-US
    ja-JP:
      - en-US
      - zh-CN
    en-US:
      - zh-CN
  cache:
    unit-ttl: 3600
    entity-ttl: 3600
    status-ttl: 1800

# 默认使用 local profile，已在 spring.profiles.active 中配置
# 部署到云端时，通过 -Dspring.profiles.active=cloud 或 SPRING_PROFILES_ACTIVE=cloud 覆盖
