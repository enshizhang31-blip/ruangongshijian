services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: salemanager-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sale_manager}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../sql/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
    networks:
      - salemanager-network

  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    container_name: salemanager-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sale_manager}
      TZ: Asia/Shanghai
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ../sql/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - salemanager-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: salemanager-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - salemanager-network

volumes:
  mysql-data:
  mongo-data:
  redis-data:

networks:
  salemanager-network:
    driver: bridge
